name: Dependency security

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tanstack-xss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun run scripts/check-tanstack-security.mjs
