name: docs.local guard

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  docs-local-guard:
    name: No tracked docs.local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard against tracked docs.local
        run: bash scripts/guard-no-docslocal.sh
